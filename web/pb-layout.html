<!doctype html>
<!-- Byte Map: where the bytes of the decoded city save (mapdump/*.pb,
     Data.LandMessage) went, coloured by how far our RE has reached.
     Drill-down stacked bars: row 0 = whole file by top-level field, click
     a segment to open its interior, click again to go deeper.
     Data is inlined by js/pb-layout-data.js (generated by
     tools/gen_pb_layout.py) — no server, no network; opens from file://. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Springfield &mdash; Byte Map</title>
<link rel="icon" type="image/png" href="assets/images/icon.png">
<link rel="stylesheet" href="css/pb-layout.css?v=16">
</head>
<body>
<header>
  <a class="brand" href="progress.html">&#8592; Progress</a>
  <h1>Byte Map</h1>
  <span class="sub" id="fileinfo">city save byte allocation</span>
  <span class="stats" id="statsbar">&hellip;</span>
</header>
<nav id="viewbar">
  <span id="crumbs"></span>
  <span class="hint">click a segment to drill in &middot; click a breadcrumb
    or Esc to go up &middot; hover for byte offsets &amp; findings</span>
  <span id="matchinfo"></span>
</nav>
<main>
  <div id="left">
    <div id="ruler"></div>
    <div id="rows"></div>
    <div id="legend"></div>
  </div>
  <aside id="pane">
    <h2>Details</h2>
    <div id="pane-body"><p class="dim">click a segment</p></div>
  </aside>
</main>
<script src="js/pb-layout-data.js?v=16"></script>
<script src="js/pb-layout.js?v=16"></script>
</body>
</html>
